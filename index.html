<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Badminton Arena</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#070b16;overflow:hidden;
    font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#e8eefc}
  #wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
  canvas{width:100%;height:100%;display:block}

  #menu{position:fixed;inset:0;display:flex;overflow:auto;padding:16px;box-sizing:border-box;
    background:radial-gradient(ellipse at 50% 20%,rgba(30,50,110,.92),rgba(5,9,20,.96))}
  #menu.hidden{display:none}
  #card{margin:auto;width:min(780px,100%);background:#0f1730;border:1px solid #2b3a66;border-radius:18px;
    padding:22px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
  h1{margin:0 0 2px;font-size:30px;letter-spacing:.5px}
  .sub{color:#8fa2d6;margin:0 0 16px;font-size:14px}
  h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#7f93cc;margin:16px 0 8px;font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{font:inherit;cursor:pointer}
  .chip{background:#18244a;color:#cfdbff;border:1px solid #2f4180;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
  .chip:hover{background:#21306a}
  .chip.on{background:#2f6bff;border-color:#6d97ff;color:#fff}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .team{background:#0b1226;border:1px solid #22305c;border-radius:12px;padding:10px 12px}
  .team h3{margin:0 0 8px;font-size:14px}
  .t0 h3{color:#8cc2ff}.t1 h3{color:#ffb1ba}
  .slot{display:flex;align-items:center;gap:8px;padding:5px 0}
  .slot b{width:26px}
  .keys{flex:1;color:#8fa2d6;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  .slot .chip{padding:5px 10px;font-size:13px;min-width:78px}
  .help{font-size:13px;line-height:1.55;color:#b9c6ee;background:#0b1226;border:1px solid #22305c;border-radius:12px;padding:10px 14px}
  .help b{color:#fff}
  kbd{background:#1b2850;border:1px solid #3a4d8f;border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}
  #start{margin-top:18px;width:100%;padding:14px;font-size:18px;font-weight:800;border:0;border-radius:12px;
    background:linear-gradient(180deg,#34d399,#12a37a);color:#04231a}
  #start:hover{filter:brightness(1.1)}
  @media (max-width:560px){.teams{grid-template-columns:1fr}}

  /* ---- kontrol sentuh ---- */
  html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  #menu{touch-action:pan-y}
  #touch{position:fixed;inset:0;pointer-events:none;display:none;--b:clamp(34px,10.5vh,58px)}
  .pad{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:calc(var(--b)*.35)}
  .pad.l{left:max(10px,env(safe-area-inset-left))}
  .pad.r{right:max(10px,env(safe-area-inset-right))}
  .dpad{display:grid;grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(3,var(--b));gap:3px}
  .dpad span{display:block}
  .tb{pointer-events:auto;touch-action:none;width:var(--b);height:var(--b);border-radius:50%;border:2px solid rgba(255,255,255,.55);
    background:rgba(20,30,60,.38);color:#fff;font-weight:800;font-size:calc(var(--b)*.4);line-height:1.05;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;text-shadow:0 1px 3px #000}
  .tb.dir{border-radius:14px}
  .tb small{font-size:calc(var(--b)*.2);font-weight:700;opacity:.9}
  .tb.on{background:rgba(255,255,255,.5);transform:scale(.94)}
  .tb.t0{border-color:rgba(140,194,255,.9)}.tb.t1{border-color:rgba(255,177,186,.9)}
  .tb.hit{width:calc(var(--b)*1.55);height:calc(var(--b)*1.55);background:rgba(255,216,74,.32);font-size:calc(var(--b)*.6);margin-bottom:calc(var(--b)*.2)}
  #tbar{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:none;gap:8px}
  #tbar button{pointer-events:auto;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.4);
    background:rgba(8,14,32,.7);color:#fff;font-size:18px;padding:0}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;z-index:5;
    background:rgba(5,9,20,.94);color:#e8eefc;font-size:20px;font-weight:700;padding:30px;flex-direction:column;gap:12px}
  #rotate span{font-size:54px}
  @media (orientation:portrait){body.playing #rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="touch"></div>
<div id="tbar"><button id="tb-pause" aria-label="Jeda">⏸</button><button id="tb-menu" aria-label="Menu">☰</button></div>
<div id="rotate"><span>📱↻</span>Putar HP ke mode landscape (mendatar) untuk bermain</div>
<div id="menu"><div id="card"></div></div>
<script src="game.js"></script>
</body>
</html>
